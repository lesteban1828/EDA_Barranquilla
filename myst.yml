    - file: 01_datos.ipynb
    - file: 02_univariado.ipynb
    - file: 03_bivariado.ipynb
    - file: 04_avaluo.ipynb
    - file: 05_geoespacial.ipynb
    - file: 06_conclusiones.md
    - file: 07_modelos.ipynb
    - file: 08_evaluacion.ipynb
  exclude:
    - README.md
    - datos/**

site:
  template: book-theme
